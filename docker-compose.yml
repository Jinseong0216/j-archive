services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - portfolio-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
